<div class="container mt-4 mb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Analytics Dashboard</h2>
    <button class="btn btn-secondary" routerLink="/dashboard">Back to Dashboard</button>
  </div>

  <div class="row">
    <!-- Total Bed Occupancy (Pie Chart) -->
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 text-primary"><i class="bi bi-pie-chart-fill me-2"></i>Bed Status</h5>
        </div>
        <div class="card-body">
          <canvas baseChart
            [data]="pieChartData"
            [options]="pieChartOptions"
            [type]="'pie'">
          </canvas>
        </div>
      </div>
    </div>

    <!-- Admission Trends (Bar Chart) -->
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 text-primary"><i class="bi bi-bar-chart-fill me-2"></i>Admission Trends</h5>
        </div>
        <div class="card-body">
          <canvas baseChart
            [data]="barChartData"
            [options]="barChartOptions"
            [type]="'bar'">
          </canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Bed Status Grid -->
  <div class="card shadow-sm border-0 mt-4">
    <div class="card-header bg-white py-3">
      <h5 class="mb-0 text-primary"><i class="bi bi-grid-3x3-gap-fill me-2"></i>Bed Occupancy Grid</h5>
    </div>
    <div class="card-body">
      <div class="row row-cols-2 row-cols-md-5 g-3">
        <div class="col" *ngFor="let bed of [].constructor(50); let i = index">
          <div class="p-3 border rounded text-center" 
               [class.bg-success-subtle]="i >= 15" 
               [class.text-success]="i >= 15"
               [class.bg-danger-subtle]="i < 15"
               [class.text-danger]="i < 15">
            <i class="bi bi-hospital me-1"></i>
            Bed {{ i + 1 }}
            <div class="small fw-bold">{{ i < 15 ? 'Occupied' : 'Available' }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
