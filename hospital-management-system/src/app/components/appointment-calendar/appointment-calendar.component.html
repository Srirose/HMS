<div class="container mt-4 mb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Appointment Calendar</h2>
    <button class="btn btn-secondary" routerLink="/dashboard">Back to Dashboard</button>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  </div>

  <!-- Booking Modal -->
  <div class="modal fade show" [class.d-block]="isModalOpen" tabindex="-1" *ngIf="isModalOpen" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Book New Appointment</h5>
          <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div *ngIf="submitError" class="alert alert-danger">{{ submitError }}</div>
          
          <form [formGroup]="bookingForm" (ngSubmit)="onSubmitBooking()">
            <div class="mb-3">
              <label class="form-label">Patient *</label>
              <select class="form-select" formControlName="patientId">
                <option value="" disabled>Select Patient</option>
                <option *ngFor="let p of patients" [value]="p.id">{{ p.firstName }} {{ p.lastName }} (#{{ p.id }})</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Doctor *</label>
              <select class="form-select" formControlName="doctorId">
                <option value="" disabled>Select Doctor</option>
                <option *ngFor="let d of doctors" [value]="d.id">{{ d.fullName }} ({{ d.specialization }})</option>
              </select>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Start Time *</label>
                <input type="datetime-local" class="form-control" formControlName="startTime">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">End Time *</label>
                <input type="datetime-local" class="form-control" formControlName="endTime">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea class="form-control" formControlName="notes" rows="2"></textarea>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="bookingForm.invalid">Book Appointment</button>
              <button type="button" class="btn btn-light" (click)="closeModal()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
