<div class="layout">
  <aside class="sidebar">
    <nav>
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        *ngIf="item.route"
      >
        {{ item.label }}
      </a>
    </nav>
  </aside>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
